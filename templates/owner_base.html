{% extends "base.html" %}

{% block body %}
<div class="owner-layout">
    <aside class="owner-sidebar">
        <div class="owner-sidebar-brand">
            <p class="owner-sidebar-brand-primary">Bread Staple</p>
            <p class="owner-sidebar-brand-secondary">BreadFlow</p>
        </div>

        <nav class="owner-nav">
            <a class="owner-nav-item {% if request.endpoint == 'owner_dashboard' %}active{% endif %}"
               href="{{ url_for('owner_dashboard') }}">Dashboard</a>
            <a class="owner-nav-item {% if request.endpoint and request.endpoint.startswith('orders.') %}active{% endif %}"
               href="{{ url_for('orders.owner_orders') }}">
                Orders
                {% if owner_pending_count %}<span class="owner-nav-badge">{{ owner_pending_count }}</span>{% endif %}
            </a>
            <a class="owner-nav-item {% if request.endpoint == 'production.production_list_view' %}active{% endif %}"
               href="{{ url_for('production.production_list_view') }}">Production</a>
            <a class="owner-nav-item {% if request.endpoint and request.endpoint.startswith('invoices.') %}active{% endif %}"
               href="{{ url_for('invoices.owner_invoices') }}">Invoices</a>
            <a class="owner-nav-item {% if request.endpoint and request.endpoint.startswith('analytics.') %}active{% endif %}"
               href="{{ url_for('analytics.dashboard') }}">Analytics</a>
            <a class="owner-nav-item {% if request.endpoint and request.endpoint.startswith('owner.') %}active{% endif %}"
               href="{{ url_for('owner.client_list') }}">Clients</a>
        </nav>

        <div class="owner-sidebar-footer">
            <form method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit">Log out</button>
            </form>
        </div>
    </aside>

    <main class="owner-content">
        {% block owner_content %}{% endblock %}
    </main>
</div>
{% endblock %}
